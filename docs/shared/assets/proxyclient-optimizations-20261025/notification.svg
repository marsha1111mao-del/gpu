<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#667791"/></marker></defs>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<rect width="1440" height="1030" fill="white"/>
<text x="58" y="64" font-size="36" fill="#17243b" font-weight="700" text-anchor="start">可信通知：依次减少发送端与目标端Host往返</text>
<text x="60" y="104" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">物理SGI是唤醒提示；授权由RMM端点归属、可信pending和私有LR决定。</text>
<text x="60" y="143" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">原路径</text>
<rect x="60" y="165" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="165" width="6" height="110" rx="3" fill="#d58120" stroke="none"/>
<text x="82" y="203" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">Client → RMM</text>
<polyline points="345,220 405,220" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="405" y="165" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="405" y="165" width="6" height="110" rx="3" fill="#d58120" stroke="none"/>
<text x="427" y="203" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">退出发送端Host</text>
<polyline points="690,220 750,220" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="750" y="165" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="750" y="165" width="6" height="110" rx="3" fill="#d58120" stroke="none"/>
<text x="772" y="203" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">KVM kick目标</text>
<polyline points="1035,220 1095,220" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1095" y="165" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="1095" y="165" width="6" height="110" rx="3" fill="#d58120" stroke="none"/>
<text x="1117" y="203" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">目标RMM → Proxy</text>
<text x="60" y="348" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">驻留请求唤醒</text>
<rect x="60" y="370" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="370" width="6" height="110" rx="3" fill="#2767d8" stroke="none"/>
<text x="82" y="408" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">Client → RMM</text>
<polyline points="345,425 405,425" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="405" y="370" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="405" y="370" width="6" height="110" rx="3" fill="#2767d8" stroke="none"/>
<text x="427" y="408" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">Root发SGI0</text>
<polyline points="690,425 750,425" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="750" y="370" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="750" y="370" width="6" height="110" rx="3" fill="#2767d8" stroke="none"/>
<text x="772" y="408" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">目标Host → RMM</text>
<polyline points="1035,425 1095,425" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1095" y="370" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="1095" y="370" width="6" height="110" rx="3" fill="#2767d8" stroke="none"/>
<text x="1117" y="408" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">IRQ127 → Proxy</text>
<text x="60" y="553" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">目标端直接返回</text>
<rect x="60" y="575" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="575" width="6" height="110" rx="3" fill="#16836a" stroke="none"/>
<text x="82" y="613" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">Client → RMM</text>
<polyline points="345,630 405,630" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="405" y="575" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="405" y="575" width="6" height="110" rx="3" fill="#16836a" stroke="none"/>
<text x="427" y="613" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">Root发SGI15</text>
<polyline points="690,630 750,630" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="750" y="575" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="750" y="575" width="6" height="110" rx="3" fill="#16836a" stroke="none"/>
<text x="772" y="613" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">目标RMM校验TAKE</text>
<polyline points="1035,630 1095,630" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1095" y="575" width="285" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="1095" y="575" width="6" height="110" rx="3" fill="#16836a" stroke="none"/>
<text x="1117" y="613" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">私有LR → Proxy</text>
<rect x="60" y="785" width="1320" height="110" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="785" width="6" height="110" rx="3" fill="#7c58bb" stroke="none"/>
<text x="82" y="823" font-size="25" fill="#7c58bb" font-weight="700" text-anchor="start">条件不满足就回退</text>
<text x="82" y="861" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">接收方主动启用、REC0驻留另一CPU、归属/MPIDR/pending匹配；否则SGI0或Host路径。</text>
<text x="82" y="891" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">两项独立结果：1158 → 1182（+2.07%）；1208 → 1237（+2.40%）。</text>
<text x="60" y="958" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">SGI15、Root服务与Host辅助模块是RK/OpenCCA集成，不是标准CCA通用接口。</text>
<text x="60" y="988" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">这里只优化已驻留目标；Host仍决定未驻留vCPU何时获得运行机会。</text>
</svg>
