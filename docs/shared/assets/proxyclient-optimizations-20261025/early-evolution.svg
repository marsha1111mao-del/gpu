<text x="82" y="1173" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">之后指定1158为近期对照，再推进到1405；两批输入与采样按各自报告读取。</text>
<text x="60" y="1228" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">图中跳过的P阶段并未丢失：正文P1–P42索引保留撤回、未命中和未执行条目。</text>
