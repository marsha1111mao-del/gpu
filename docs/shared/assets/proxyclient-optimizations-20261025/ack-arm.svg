<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#667791"/></marker></defs>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<rect width="1440" height="1130" fill="white"/>
<text x="58" y="64" font-size="36" fill="#17243b" font-weight="700" text-anchor="start">ACK_ARM：一次重置，加一次队列重查</text>
<text x="60" y="104" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">事件序号由RMM维护；数据仍在共享队列，通知只表示应重新检查。</text>
<rect x="60" y="155" width="390" height="150" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="155" width="6" height="150" rx="3" fill="#2767d8" stroke="none"/>
<text x="82" y="193" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">① Guest接收者排空</text>
<text x="82" y="231" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">私有复制、校验并处理消息</text>
<text x="82" y="261" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">暂时观察到队列空</text>
<rect x="525" y="155" width="390" height="150" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="525" y="155" width="6" height="150" rx="3" fill="#d58120" stroke="none"/>
<text x="547" y="193" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">② RMM原子ACK_ARM</text>
<text x="547" y="231" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">acknowledged = pending</text>
<text x="547" y="261" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">armed = true</text>
<rect x="990" y="155" width="390" height="150" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="990" y="155" width="6" height="150" rx="3" fill="#16836a" stroke="none"/>
<text x="1012" y="193" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">③ Guest acquire重查</text>
<text x="1012" y="231" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">再次检查共享队列</text>
<text x="1012" y="261" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">有数据就继续处理</text>
<polyline points="450,230 525,230" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="915,230 990,230" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="620" height="185" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="420" width="6" height="185" rx="3" fill="#2767d8" stroke="none"/>
<text x="82" y="458" font-size="25" fill="#2767d8" font-weight="700" text-anchor="start">情况A：通知早于ACK_ARM</text>
<text x="82" y="496" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">数据已经发布；旧通知可能被本次确认</text>
<text x="82" y="526" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">③重查发现数据，继续排空</text>
<text x="82" y="556" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">不能因armed=true就直接睡眠</text>
<rect x="760" y="420" width="620" height="185" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="760" y="420" width="6" height="185" rx="3" fill="#16836a" stroke="none"/>
<text x="782" y="458" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">情况B：通知晚于ACK_ARM</text>
<text x="782" y="496" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">发送者先发布数据，再NOTIFY</text>
<text x="782" y="526" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">RMM看到armed，记录并触发可信唤醒</text>
<text x="782" y="556" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">若③已取到消息，额外提示也允许</text>
<polyline points="720,305 720,360 370,360 370,420" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="720,360 1060,360 1060,420" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="725" width="620" height="150" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="725" width="6" height="150" rx="3" fill="#7c58bb" stroke="none"/>
<text x="82" y="763" font-size="25" fill="#7c58bb" font-weight="700" text-anchor="start">旧路径</text>
<text x="82" y="801" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">排空 → QUERY → ACK → ARM → 重查</text>
<text x="82" y="831" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">多次Realm / RMM调用</text>
<rect x="760" y="725" width="620" height="150" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="760" y="725" width="6" height="150" rx="3" fill="#d58120" stroke="none"/>
<text x="782" y="763" font-size="25" fill="#d58120" font-weight="700" text-anchor="start">新路径</text>
<text x="782" y="801" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">排空 → ACK_ARM → 重查 → 必要时睡眠</text>
<text x="782" y="831" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">身份、通道与生命周期检查保留</text>
<polyline points="680,800 760,800" fill="none" stroke="#667791" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="935" width="1320" height="75" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="935" width="6" height="75" rx="3" fill="#16836a" stroke="none"/>
<text x="82" y="973" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">P2 196 → 197：单独未证明提分；P3进一步删IRQ线程 / QUERY后197 → 296。</text>
<text x="60" y="1058" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">重查与发布顺序是避免丢唤醒的条件；IRQ不是数据授权，也不是GPU完成证明。</text>
<text x="60" y="1088" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">通知与等待队列协作仍须遵守内核等待协议；原子事件更新不代替队列内存序。</text>
</svg>
