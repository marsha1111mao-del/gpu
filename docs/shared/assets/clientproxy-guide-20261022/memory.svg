<text x="245" y="601" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">CPU 133.09 + 源池 384 + 元数据 2.24</text>
<rect x="60" y="695" width="1320" height="122" rx="14" fill="#f3f6fb" stroke="#d9e1ee"/>
<rect x="60" y="695" width="6" height="122" rx="3" fill="#16836a" stroke="none"/>
<text x="82" y="733" font-size="25" fill="#16836a" font-weight="700" text-anchor="start">结果与口径</text>
<text x="82" y="771" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">合计减少383.93 MiB / 42.50%；相对Native额外占比由98.88%降至14.35%。</text>
<text x="82" y="801" font-size="21" fill="#17243b" font-weight="400" text-anchor="start">源池已含327.77 MiB用户BO，不能重复相加；旧目标实际缓存页98304 → 0。</text>
<text x="60" y="868" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">这是各分项峰值之和，不是同时总峰值；排除OS/VM固定预算、GPU页表及未计全的协议分配。</text>
<text x="60" y="898" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">启动时仍需临时目标CMA；回收后稳态占用不等于启动准入预算。</text>
</svg>
