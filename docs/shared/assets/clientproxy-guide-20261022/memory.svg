<rect x="1218.1016" y="375" width="2.4192000000000005" height="66" rx="0" fill="#c24e6a" stroke="none"/>
<text x="1235.5208" y="418" font-size="25" fill="#17243b" font-weight="700" text-anchor="start">903.26</text>
<text x="245" y="471" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">CPU 133.02 + 源池 384 + 旧目标 384 + 元数据 2.24</text>
