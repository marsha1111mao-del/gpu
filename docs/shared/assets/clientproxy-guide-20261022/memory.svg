<text x="58" y="64" font-size="36" fill="#17243b" font-weight="700" text-anchor="start">D  内存实测：消除旧目标副本，实际GPU数据不变</text>
<text x="60" y="104" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">单Client ResNet50；单位MiB；同384 MiB共享源池。数据引用既有实验，无新增测量。</text>
